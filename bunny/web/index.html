<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<title>Bunny</title>
<style>
  :root {
    --bg1: #141a3d; --bg2: #070a1a; --fur: #fbf8ff; --fur-edge: #ddd5ef; --pink: #ffb3c9; --nose: #ff7fa3;
    --eye: #1b1530; --ink: #5a4a6e; --ring: #5ef0d0; --text: #f4f1ff; --muted: #9aa0c8; --warn: #ffcf6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg2); color: var(--text);
    font-family: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; user-select: none; }
  body { background: radial-gradient(120% 90% at 50% 38%, var(--bg1) 0%, var(--bg2) 70%); transition: filter .6s; }
  body.offline { filter: grayscale(.85) brightness(.75); }
  body.state-sleep { filter: brightness(.55); }

  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top)) 16px max(8px, env(safe-area-inset-bottom)); }
  #faces { display: flex; justify-content: center; }
  .face { display: none; height: min(58vh, 82vw); width: auto; aspect-ratio: 400 / 440; flex: 0 0 auto; overflow: visible;
    animation: breathe 4.5s ease-in-out infinite; cursor: pointer; }
  @media (orientation: landscape) { .face { height: min(70vh, 52vw); } }
  body[data-char="bunny"] .face[data-char="bunny"], body[data-char="pixel"] .face[data-char="pixel"],
  body[data-char="robo"] .face[data-char="robo"] { display: block; }
  @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.2%) } }
  body.state-happy .face { animation: hop .55s ease-out 2, breathe 4.5s ease-in-out infinite 1.1s; }
  @keyframes hop { 0% { transform: translateY(0) } 40% { transform: translateY(-6%) scale(1.02, .98) } 100% { transform: translateY(0) } }
  .tilt { transform-box: view-box; transform-origin: 200px 300px; transition: transform .4s; }
  body.state-confused .tilt { transform: rotate(-6deg); }

  /* shared bits */
  .eye-open, .t-eye { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .09s; }
  .face.blink .eye-open { transform: scaleY(.08); }
  .js-look { transition: transform .5s cubic-bezier(.3,1.3,.5,1); }
  .eye-happy, .eye-sleep { display: none; }
  body.state-happy .eye-open, body.state-sleep .eye-open { display: none; }
  body.state-happy .eye-happy, body.state-sleep .eye-sleep { display: inline; }
  .mouth { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); }
  .js-mouth-closed { transition: opacity .1s; }
  .ring { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; transition: opacity .3s; }
  body.state-listening .ring { opacity: 1; }
  .fx-dots, .fx-zzz, .fx-q { opacity: 0; transition: opacity .3s; }
  body.state-thinking .fx-dots, body.state-hearing .fx-dots { opacity: 1; }
  body.state-sleep .fx-zzz { opacity: 1; } body.state-confused .fx-q { opacity: 1; }
  .fx-dots circle { animation: dot 1.1s ease-in-out infinite; } .fx-dots circle:nth-child(2) { animation-delay: .18s } .fx-dots circle:nth-child(3) { animation-delay: .36s }
  @keyframes dot { 0%,100% { opacity: .25; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-5px) } }
  .fx-zzz text { animation: zz 3s ease-in-out infinite; } .fx-zzz text:nth-child(2) { animation-delay: 1s } .fx-zzz text:nth-child(3) { animation-delay: 2s }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0) } 30% { opacity: 1 } 100% { opacity: 0; transform: translate(14px,-30px) } }
  .js-twitch.twitch { animation: twitch .35s ease-in-out 2 !important; }
  @keyframes twitch { 50% { transform: rotate(var(--tw, 6deg)) } }

  /* Bunny */
  .ear { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
  #earL { transform: rotate(-14deg); } #earR { transform: rotate(14deg); }
  body.state-listening #earL { transform: rotate(-4deg) scaleY(1.06); } body.state-listening #earR { transform: rotate(4deg) scaleY(1.06); }
  body.state-thinking #earL, body.state-hearing #earL { transform: rotate(-24deg); }
  body.state-thinking #earR, body.state-hearing #earR { transform: rotate(6deg); }
  body.state-confused #earR { transform: rotate(68deg) scaleY(.92); }
  body.state-sleep #earL { transform: rotate(-58deg) scaleY(.9); } body.state-sleep #earR { transform: rotate(58deg) scaleY(.9); }
  body.state-speaking #earL { animation: earbobL 1.2s ease-in-out infinite; } body.state-speaking #earR { animation: earbobR 1.2s ease-in-out infinite; }
  @keyframes earbobL { 0%,100% { transform: rotate(-12deg) } 50% { transform: rotate(-17deg) } }
  @keyframes earbobR { 0%,100% { transform: rotate(12deg) } 50% { transform: rotate(17deg) } }
  body.state-listening .face[data-char="bunny"] .eye-open { transform: scale(1.1); }
  .cheeks ellipse { transition: opacity .4s; opacity: .45; } body.state-happy .cheeks ellipse { opacity: .85; }

  /* Pixel */
  .p-eye { transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  body.state-listening .p-eye { transform: scale(1.08, 1.14); }
  body.state-thinking .p-eye, body.state-hearing .p-eye { transform: scale(.86, .62); }
  body.state-confused #pEyeL .p-eye { transform: scale(.66); } body.state-confused #pEyeR .p-eye { transform: rotate(10deg) scale(1.04); }
  body.state-speaking .p-eye { animation: ppulse .5s ease-in-out infinite alternate; }
  @keyframes ppulse { from { transform: scale(1, 1) } to { transform: scale(1.04, .94) } }
  .face[data-char="pixel"].blink .p-eye { transform: scaleY(.06); }
  body.state-sleep .face[data-char="pixel"] { opacity: .6; }

  /* Robo */
  .t-bulb { fill: #ff5a5a; animation: bulb 2.4s ease-in-out infinite; }
  @keyframes bulb { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  body.state-listening .t-bulb { fill: #5ef07a; animation-duration: .5s; }
  body.state-thinking .t-bulb, body.state-hearing .t-bulb { fill: #ffd84a; animation-duration: .3s; }
  body.state-speaking .t-bulb { fill: #ffb347; animation-duration: .8s; }
  body.state-sleep .t-bulb { fill: #66708a; animation: none; opacity: .5; }
  .t-brow { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
  body.state-listening .t-brow, body.state-happy .t-brow { transform: translateY(-8px); }
  body.state-thinking .t-browL, body.state-hearing .t-browL { transform: translateY(-10px) rotate(-8deg); }
  body.state-confused .t-browL { transform: rotate(16deg) translateY(4px); } body.state-confused .t-browR { transform: translateY(-10px) rotate(-10deg); }
  body.state-sleep .t-brow { transform: translateY(6px); }
  .t-bolt { transform-box: fill-box; transform-origin: 50% 50%; }
  .t-light { transform-origin: 50% 50%; }
  body.state-listening .face[data-char="robo"] .t-eye { transform: scale(1.06); }

  /* words */
  #words { width: min(92vw, 900px); text-align: center; min-height: 3.2em; margin-top: 1vh; }
  #you { color: var(--muted); font-size: clamp(13px, 2.6vh, 18px); min-height: 1.3em; opacity: .9; }
  #said { font-size: clamp(17px, 4.6vh, 32px); line-height: 1.35; font-weight: 600; text-shadow: 0 2px 18px rgba(0,0,0,.6);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* top bar */
  #bar { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 5; }
  #pill { font-size: 13px; color: var(--muted); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    padding: 5px 10px; border-radius: 99px; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pill.warn { color: var(--warn); }
  .sp { flex: 1; }
  .btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06);
    color: var(--text); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  .btn.off { color: #ff8a8a; border-color: rgba(255,120,120,.4); }
  #typeBar { position: fixed; left: 12px; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); display: none; gap: 8px; z-index: 6; }
  #typeBar.show { display: flex; }
  #typeBar input { flex: 1; font: inherit; font-size: 17px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(10,14,36,.9); color: var(--text); outline: none; }

  /* character picker */
  #picker { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
    background: rgba(5,8,20,.8); backdrop-filter: blur(6px); padding: 16px; }
  #picker.show { display: flex; }
  .sheet { width: min(760px, 100%); text-align: center; }
  .ptitle { font-size: clamp(18px, 4vh, 26px); font-weight: 700; margin-bottom: 14px; }
  .cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .card { flex: 1 1 150px; max-width: 220px; padding: 10px 10px 12px; border-radius: 18px; background: rgba(255,255,255,.06);
    border: 2px solid rgba(255,255,255,.1); cursor: pointer; }
  .card.on { border-color: var(--ring); background: rgba(94,240,208,.1); }
  .card svg { display: block !important; height: min(26vh, 150px) !important; margin: 0 auto; animation: none !important; }
  .card .cname { font-weight: 700; font-size: 18px; margin-top: 4px; }
  .card .csay { color: var(--muted); font-size: 13px; }

  /* start screen */
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(7,10,26,.82); backdrop-filter: blur(4px); text-align: center; padding: 24px; cursor: pointer; }
  #start h1 { margin: 0; font-size: clamp(26px, 7vh, 46px); letter-spacing: .5px; }
  #start p { margin: 0; color: var(--muted); font-size: clamp(14px, 3vh, 19px); max-width: 560px; }
  #start .go { margin-top: 8px; padding: 12px 26px; border-radius: 99px; background: var(--fur); color: #1b1530; font-weight: 700; font-size: 18px; }
  #start.gone { display: none; }
</style>
</head>

<script>
"use strict";
const BOOT = /*BOOT*/null || { token: new URLSearchParams(location.search).get("token") || "", follow: 8, lang: "auto",
  character: "bunny", characters: [{ id: "bunny", name: "Bunny", pitch: 1.35, rate: 1.02 }, { id: "pixel", name: "Pixel", pitch: 1.6, rate: 1.08 }, { id: "robo", name: "Robo", pitch: 1.1, rate: 1.05 }] };
const $ = (id) => document.getElementById(id);
const T = (hi, en) => (BOOT.lang === "english" ? en : hi);
const ui = {
  ears_loading: T("कान तैयार हो रहे हैं…", "Getting my ears ready…"),
  ears_ready: T("बोलो: “बनी …”", "Say: “Bunny …”"),
  ears_error: T("कान में दिक्कत: कंप्यूटर की विंडो देखो", "Ears problem: check the PC window"),
  brain_off: T("दिमाग (Ollama) बंद है", "Brain (Ollama) is off"),
  brain_download: T("दिमाग डाउनलोड हो रहा है", "Downloading my brain"),
  brain_ready: T("सब तैयार", "All ready"),
  brain_error: T("दिमाग डाउनलोड नहीं हुआ", "Brain download failed"),
  offline: T("कंप्यूटर से कनेक्शन नहीं है…", "Can't reach the computer…"),
  micoff: T("माइक बंद है", "Microphone off"),
};

// ------------------------------------------------------------ characters
let char = BOOT.character || "bunny";
const cur = () => document.querySelector(`.face[data-char="${char}"]`);
const charInfo = () => (BOOT.characters || []).find((c) => c.id === char) || { name: "Bunny", pitch: 1.35, rate: 1.02 };
function setChar(id) {
  if (!document.querySelector(`.face[data-char="${id}"]`)) return;
  char = id; document.body.dataset.char = id;
  document.title = charInfo().name;
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.dataset.id === id));
  setState("happy", 1400);
}

// ------------------------------------------------------------ face states
let state = "idle", stateTimer = 0, lastActive = Date.now();
function setState(s, ms) {
  state = s;
  document.body.className = document.body.className.replace(/state-\w+/g, "").trim() + " state-" + s;
  clearTimeout(stateTimer);
  if (ms) stateTimer = setTimeout(() => setState(followActive() ? "listening" : "idle"), ms);
  if (s !== "idle" && s !== "sleep") lastActive = Date.now();
}
function blink() {
  const f = cur();
  f.classList.add("blink");
  setTimeout(() => f.classList.remove("blink"), 120);
  setTimeout(blink, 2200 + Math.random() * 4200);
}
function look() {
  const el = cur().querySelector(".js-look");
  const [rx, ry] = (el.dataset.look || "16,8").split(",").map(Number);
  let x = 0, y = 0;
  if (state === "idle") { x = (Math.random() - .5) * rx; y = (Math.random() - .5) * ry; }
  if (state === "thinking" || state === "hearing") { x = rx * .45; y = -ry; }
  el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  setTimeout(look, state === "idle" ? 1800 + Math.random() * 2600 : 600);
}
function twitch() {
  if (state === "idle" || state === "listening") {
    const els = cur().querySelectorAll(".js-twitch");
    if (els.length) {
      const i = Math.floor(Math.random() * els.length), e = els[i];
      e.style.setProperty("--tw", i === 0 ? "-20deg" : "20deg");
      e.classList.add("twitch"); setTimeout(() => e.classList.remove("twitch"), 800);
    }
  }
  setTimeout(twitch, 6000 + Math.random() * 9000);
}
setInterval(() => { // fall asleep after 3 quiet minutes
  if (state === "idle" && Date.now() - lastActive > 180000) setState("sleep");
}, 5000);

// mouth while speaking
let talking = false, mouthT = 0;
function mouth() {
  const f = cur(), open = f.querySelector(".js-mouth"), closed = f.querySelector(".js-mouth-closed");
  if (talking) {
    mouthT += 1;
    const v = Math.max(0, Math.sin(mouthT * 0.9) * 0.6 + Math.random() * 0.55);
    open.style.transform = `scaleY(${Math.min(1, 0.25 + v).toFixed(2)})`;
    if (closed) closed.style.opacity = 0;
  } else { open.style.transform = "scaleY(0)"; if (closed) closed.style.opacity = 1; }
}
setInterval(mouth, 85);

// ------------------------------------------------------------ speaking (phone voice)
let voices = [], speakQ = [], speaking = false, endedAt = 0;
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang) {
  const want = lang === "english" ? ["en-IN", "en-GB", "en-US", "en"] : lang === "hinglish" ? ["en-IN", "hi-IN", "en"] : ["hi-IN", "hi"];
  for (const w of want) {
    const v = voices.find((v) => v.lang.replace("_", "-").toLowerCase().startsWith(w.toLowerCase()));
    if (v) return v;
  }
  return null;
}
function say(text, lang, mood) {
  $("said").textContent = text;
  speakQ.push({ text, lang, mood });
  if (!speaking) nextSay();
}
function nextSay() {
  const item = speakQ.shift();
  if (!item) { speaking = false; talking = false; endedAt = Date.now(); afterSpeaking(); return; }
  speaking = true;
  $("said").textContent = item.text;
  if (!("speechSynthesis" in window)) { setTimeout(nextSay, 1200 + item.text.length * 55); return; }
  const u = new SpeechSynthesisUtterance(item.text);
  const v = pickVoice(item.lang);
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = item.lang === "english" ? "en-IN" : "hi-IN";
  u.pitch = charInfo().pitch || 1.3; u.rate = charInfo().rate || 1.02;
  u.onstart = () => { talking = true; setState(item.mood === "happy" ? "happy" : item.mood === "confused" ? "confused" : "speaking"); if (item.mood) setTimeout(() => { if (talking) setState("speaking"); }, 1100); };
  u.onboundary = () => { mouthT += 2; };
  const done = () => { talking = false; clearTimeout(guard); setTimeout(nextSay, 120); };
  u.onend = done; u.onerror = done;
  // Android sometimes never fires onend: guard
  const guard = setTimeout(done, 4000 + item.text.length * 140);
  speechSynthesis.speak(u);
}
let sayEnded = true, wantListen = false;
function afterSpeaking() {
  if (!sayEnded) return; // the AI is still writing more sentences
  if (state === "sleep") return;
  openFollow();
}
function stopTalking() { speakQ = []; try { speechSynthesis.cancel(); } catch (e) {} talking = false; speaking = false; setState("idle"); }

// ------------------------------------------------------------ "talk again" window
let followUntil = 0;
function followActive() { return Date.now() < followUntil; }
function openFollow(sec) {
  followUntil = Date.now() + (sec || BOOT.follow || 8) * 1000;
  setState("listening", (sec || BOOT.follow || 8) * 1000);
}

// ------------------------------------------------------------ server link
let es = null, online = false;
function pill(text, warn) { const p = $("pill"); p.textContent = text; p.classList.toggle("warn", !!warn); }
let statusText = ui.ears_loading;
function connect() {
  es = new EventSource("/api/events?token=" + encodeURIComponent(BOOT.token));
  es.onopen = () => { online = true; document.body.classList.remove("offline"); pill(micOn ? statusText : ui.micoff, !micOn); };
  es.onerror = () => { online = false; document.body.classList.add("offline"); pill(ui.offline, true); };
  es.onmessage = (m) => { let ev; try { ev = JSON.parse(m.data); } catch (e) { return; } onEvent(ev); };
}
function onEvent(ev) {
  switch (ev.type) {
    case "hello": {
      const s = ev.status || {};
      if (s.ears && s.ears.ready) statusText = ui.ears_ready;
      if (s.brain && !s.brain.running) statusText = ui.brain_off;
      pill(statusText, !(s.ears && s.ears.ready)); break;
    }
    case "status": {
      let t = ui[ev.text] || ev.text;
      if (ev.text === "brain_download" && ev.progress != null) t += " " + Math.round(ev.progress * 100) + "%";
      if (ev.text === "brain_ready") t = ui.ears_ready;
      statusText = t; pill(t, /error|off/.test(ev.text)); break;
    }
    case "state":
      if (ev.state === "sleep") { stopTalking(); setState("sleep"); }
      else setState(ev.state, ev.state === "hearing" ? 12000 : ev.state === "thinking" ? 60000 : 0);
      break;
    case "heard": $("you").textContent = "“" + ev.text + "”"; lastActive = Date.now(); if (state === "sleep") setState("listening"); break;
    case "ignored": if (state === "hearing") setState(followActive() ? "listening" : "idle"); break;
    case "say": sayEnded = ev.final !== false; say(ev.text, ev.lang || BOOT.lang, ev.mood); break;
    case "say_end": sayEnded = true; if (!speaking) afterSpeaking(); break;
    case "listen": wantListen = true; break;
    case "stop": stopTalking(); break;
    case "action": lastActive = Date.now(); break;
    case "character": setChar(ev.id); break;
    case "error": setState("confused", 2500); break;
  }
}

// ------------------------------------------------------------ microphone + voice detection
let micOn = true, ctx = null, rate = 48000;
const PRE = 0.35, END_SIL = 0.75, MIN_SPEECH = 0.35, MAX_SPEECH = 12;
let floor = 0.008, inSpeech = false, speechLen = 0, silLen = 0, chunks = [], pre = [], preLen = 0;

function downsample(buf, from) {
  const ratio = from / 16000, n = Math.floor(buf.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * ratio), e = Math.min(buf.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = s; j < e; j++) sum += buf[j];
    out[i] = sum / Math.max(1, e - s);
  }
  return out;
}
function onAudio(buf) {
  if (!micOn || !online) return;
  // don't listen to ourselves while speaking (and a moment after)
  if (speaking || talking || Date.now() - endedAt < 450) { inSpeech = false; chunks = []; return; }
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length), dur = buf.length / rate;
  const small = downsample(buf, rate);
  if (state === "listening") { const s = Math.min(1.25, 1 + rms * 6); cur().querySelector(".js-ring").style.transform = `scale(${s.toFixed(3)})`; }
  const startTh = Math.max(floor * 3.2, 0.012), endTh = Math.max(floor * 2.0, 0.008);
  if (!inSpeech) {
    if (rms < floor * 2) floor = floor * 0.97 + rms * 0.03; else floor *= 1.0015;
    floor = Math.min(Math.max(floor, 0.0015), 0.05);
    pre.push(small); preLen += dur;
    while (preLen > PRE && pre.length > 1) { preLen -= pre[0].length / 16000; pre.shift(); }
    if (rms > startTh) { inSpeech = true; speechLen = 0; silLen = 0; chunks = pre.slice(); pre = []; preLen = 0; }
    return;
  }
  chunks.push(small); speechLen += dur;
  silLen = rms < endTh ? silLen + dur : 0;
  if (silLen >= END_SIL || speechLen >= MAX_SPEECH) {
    inSpeech = false;
    const got = chunks; chunks = [];
    if (speechLen - silLen >= MIN_SPEECH) send(got);
  }
}
function wav(chunks) {
  let n = 0; for (const c of chunks) n += c.length;
  const b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44; for (const c of chunks) for (let i = 0; i < c.length; i++, o += 2) v.setInt16(o, Math.max(-1, Math.min(1, c[i])) * 32767, true);
  return b;
}
async function send(chunks) {
  const follow = followActive() || wantListen;
  wantListen = false;
  if (follow) setState("hearing", 12000);
  try {
    await fetch("/api/hear?follow=" + (follow ? 1 : 0), { method: "POST", headers: { "X-Bunny-Token": BOOT.token, "Content-Type": "audio/wav" }, body: wav(chunks) });
  } catch (e) { /* offline: shown by the event stream */ }
}
async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  rate = ctx.sampleRate;
  const src = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(2048, 1, 1);
  proc.onaudioprocess = (e) => onAudio(e.inputBuffer.getChannelData(0));
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
}

// ------------------------------------------------------------ buttons
async function typed(text) {
  if (!text.trim()) return;
  $("you").textContent = "“" + text + "”";
  try { await fetch("/api/text", { method: "POST", headers: { "X-Bunny-Token": BOOT.token, "Content-Type": "application/json" }, body: JSON.stringify({ text }) }); } catch (e) {}
}
$("btnType").onclick = (e) => { e.stopPropagation(); $("typeBar").classList.toggle("show"); if ($("typeBar").classList.contains("show")) $("typeIn").focus(); };
$("typeGo").onclick = (e) => { e.stopPropagation(); typed($("typeIn").value); $("typeIn").value = ""; };
$("typeIn").onkeydown = (e) => { if (e.key === "Enter") { typed($("typeIn").value); $("typeIn").value = ""; } };
$("btnMic").onclick = (e) => { e.stopPropagation(); micOn = !micOn; $("btnMic").classList.toggle("off", !micOn); pill(micOn ? statusText : ui.micoff, !micOn); };
$("faces").onclick = () => { // tap the face = talk without saying the name
  if (speaking) { stopTalking(); return; }
  if (state === "sleep") setState("idle");
  openFollow();
};

// character picker
const SAY = { bunny: T("बोलो “बनी”", "Say “Bunny”"), pixel: T("बोलो “पिक्सल”", "Say “Pixel”"), robo: T("बोलो “रोबो”", "Say “Robo”") };
function buildPicker() {
  const box = $("cards"); box.innerHTML = "";
  $("pickTitle").textContent = T("अपना दोस्त चुनो", "Choose your buddy");
  for (const c of BOOT.characters || []) {
    const card = document.createElement("div"); card.className = "card"; card.dataset.id = c.id;
    const face = document.querySelector(`.face[data-char="${c.id}"]`).cloneNode(true);
    // give the copy its own ids (gradients/filters of a hidden face can't be borrowed)
    face.querySelectorAll("[id]").forEach((n) => {
      const old = n.id, nid = old + "-c";
      n.id = nid;
      face.querySelectorAll("*").forEach((m) => {
        for (const a of ["fill", "stroke", "filter"]) {
          const v = m.getAttribute(a);
          if (v && v.includes("url(#" + old + ")")) m.setAttribute(a, v.replace("url(#" + old + ")", "url(#" + nid + ")"));
        }
      });
    });
    card.appendChild(face);
    const n = document.createElement("div"); n.className = "cname"; n.textContent = c.name; card.appendChild(n);
    const h = document.createElement("div"); h.className = "csay"; h.textContent = SAY[c.id] || ""; card.appendChild(h);
    card.onclick = async (e) => {
      e.stopPropagation(); $("picker").classList.remove("show"); setChar(c.id);
      try { await fetch("/api/character", { method: "POST", headers: { "X-Bunny-Token": BOOT.token, "Content-Type": "application/json" }, body: JSON.stringify({ id: c.id }) }); } catch (err) {}
    };
    box.appendChild(card);
  }
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.dataset.id === char));
}
$("btnChar").onclick = (e) => { e.stopPropagation(); buildPicker(); $("picker").classList.add("show"); };
$("picker").onclick = () => $("picker").classList.remove("show");

let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

$("start").onclick = async () => {
  try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
  try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {}
  keepAwake();
  try { speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); } catch (e) {}
  try { await startMic(); } catch (e) { $("startText").textContent = T("माइक की इजाज़त नहीं मिली। Chrome में माइक Allow करो और फिर टैप करो।", "Microphone blocked. Allow it in Chrome, then tap again."); return; }
  $("start").classList.add("gone");
  setState("happy", 1400);
};

$("startText").textContent = T("बनी को जगाने के लिए कहीं भी टैप करो। माइक का पूछे तो Allow करना।", "Tap anywhere to wake Bunny. Allow the microphone when asked.");
$("startGo").textContent = T("टैप करो", "Tap to start");
setChar(char); setState("idle");
$("startName").textContent = ({ bunny: "🐰 ", pixel: "👀 ", robo: "🤖 " }[char] || "") + charInfo().name;
connect(); blink(); look(); twitch();
</script>
</body>
</html>
